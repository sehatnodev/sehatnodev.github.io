<!DOCTYPE html>
<html>

<head>
	<title>Geolocation</title>
	<link rel="stylesheet" href="https://unpkg.com/leaflet@1.8.0/dist/leaflet.css" />
	<link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css" />

	<style>
		body {
			margin: 0;
			padding: 0;
		}
	</style>

</head>

<body>
	<div id="map" style="width:100%; height: 100vh"></div>
	<script src="https://unpkg.com/leaflet@1.8.0/dist/leaflet.js"></script>
	<script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>

	<script>
		// Map initialization with a generic starting point
		var map = L.map('map').setView([0, 0], 2); // Initial view set to 0, 0 (near the equator)
		L.tileLayer('http://{s}.tile.osm.org/{z}/{x}/{y}.png', {
			attribution: 'Leaflet &copy; OpenStreetMap contributors',
			maxZoom: 18
		}).addTo(map);

		var taxiIcon = L.icon({
			iconUrl: 'img/taxi.png',
			iconSize: [70, 70]
		});

		// Geolocation: Get current position
		if (navigator.geolocation) {
			navigator.geolocation.getCurrentPosition(function (position) {
				const userLat = position.coords.latitude;
				const userLng = position.coords.longitude;

				// Set view to user's current location
				map.setView([userLat, userLng], 13);

				// Add marker for the user's current location
				L.marker([userLat, userLng], { icon: taxiIcon })
					.bindPopup("You are here!")
					.addTo(map)
					.openPopup();

				console.log(`Your current location is Latitude: ${userLat}, Longitude: ${userLng}`);
			}, function (error) {
				alert("Unable to retrieve your location. Please check your GPS and browser settings.");
				console.error(error);
			}, {
				enableHighAccuracy: true, // Use the most accurate location (GPS)
				timeout: 10000,           // Timeout for getting location
				maximumAge: 0             // Disable caching of location
			});
		} else {
			alert("Geolocation is not supported by your browser.");
		}

		// Click event on map for routing
		map.on('click', function (e) {
			var newMarker = L.marker([e.latlng.lat, e.latlng.lng]).addTo(map);
			L.Routing.control({
				waypoints: [
					L.latLng(marker.getLatLng().lat, marker.getLatLng().lng),
					L.latLng(e.latlng.lat, e.latlng.lng)
				]
			}).on('routesfound', function (e) {
				var routes = e.routes;
				console.log(routes);

				e.routes[0].coordinates.forEach(function (coord, index) {
					setTimeout(function () {
						marker.setLatLng([coord.lat, coord.lng]);
					}, 100 * index);
				});
			}).addTo(map);
		});
	</script>
</body>

</html>
